name: Tel

on:
  workflow_dispatch:
    inputs:
      task-name:
        description: Task name to run. Leave empty to run all tasks.
        required: false
        type: string
        default: ""
  repository_dispatch:
    types: [random_run]
  # schedule:
  #   # run at 9am
  #   - cron: "0 1 * * *"

jobs:
  singer:
    runs-on: ubuntu-slim
    # env:
      # secrets 不能直接用于 if:,先在这里判断是否配置了 Notion
      # NOTION_ENABLED: ${{ secrets.NOTION_TOKEN != '' && secrets.NOTION_DATABASE_ID != '' }}
    steps:

      - name: Download from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
        run: |
          curl -O "$(aws s3 presign --endpoint-url ${{ secrets.R2_ENDPOINT }} s3://action/tasks.toml --expires-in 300)"
          curl -O "$(aws s3 presign --endpoint-url ${{ secrets.R2_ENDPOINT }} s3://action/session --expires-in 300)"

      - id: tel
        uses: bxb100/tel@action
        env:
          RUST_LOG: debug
          RUST_BACKTRACE: 1
        with:
          task_path: ./tasks.toml
          session_path: ./session
          task_name: ${{ inputs.task-name }}

      # - name: Upload log to Notion
      #   id: notion
      #   if: always() && env.NOTION_ENABLED == 'true' && steps.tel.outputs.log_path != ''
      #   uses: bxb100/action-notion@main
      #   with:
      #     notion_token: ${{ secrets.NOTION_TOKEN }}
      #     database_id: ${{ secrets.NOTION_DATABASE_ID }}
      #     title: "tel #${{ github.run_number }}"
      #     content_file: ${{ steps.tel.outputs.log_path }}
      #     content_format: plain

      - name: Upload to R2
        uses: bxb100/action-upload@v0
        with:
          provider: s3
          provider_options: |
            root=/
            bucket=action
            region=auto
            endpoint=${{secrets.R2_ENDPOINT}}
            access_key_id=${{secrets.R2_ACCESS_KEY_ID}}
            secret_access_key=${{secrets.R2_SECRET_ACCESS_KEY}}
          include: 'session'
